<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Elaina Pet</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
<div id="stage">
  <div id="dragStrip" title="按住拖动"><span>⠿ 按住此处拖动</span></div>
  <button id="petBackBtn" type="button" title="返回主界面" style="display:none">⟲</button>
  <!-- 关闭桌宠：必须做在网页里。WPF 的 WebView2 是 HwndHost，
       任何叠在它上面的 WPF 控件（原生按钮）都会被它的原生子窗口盖住、收不到鼠标。 -->
  <button id="petCloseBtn" type="button" title="关闭桌宠" style="display:none">✕</button>

  <!-- 顶部：气泡区 -->
  <div id="dialogZone">
    <div id="bubbleScroller">
      <div class="pet-bubble bot" id="helloBubble">
        <div class="pet-speak">伊蕾娜</div>
        <div class="pet-msg">你好呀，我是伊蕾娜～</div>
      </div>
    </div>
  </div>

  <!-- 中部：立绘（静态画面 + 呼吸动画） -->
  <div id="avatarZone">
    <img id="petAvatar" src="img/elaina/p_calm.png" alt="伊蕾娜">
  </div>

  <!-- 底部：输入 -->
  <div id="inputZone">
    <button id="petMic" type="button" title="语音输入">🎤</button>
    <input id="petInput" type="text" placeholder="和伊蕾娜说点什么…" autocomplete="off">
    <button id="petSend" type="button">➤</button>
  </div>
</div>
<script src="js/elaina-emotion.js" defer></script>
  <script src="pet.js"></script>
</body>
</html>
