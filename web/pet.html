<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Elaina Pet</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
<div id="stage">
  <div id="dragStrip" title="按住拖动"></div>

  <!-- 顶部：气泡区 -->
  <div id="dialogZone">
    <div id="bubbleScroller">
      <div class="pet-bubble bot" id="helloBubble">
        <div class="pet-speak">伊蕾娜</div>
        <div class="pet-msg">你好呀，我是伊蕾娜～</div>
      </div>
    </div>
  </div>

  <!-- 中部：立绘（静态画面 + 呼吸动画） -->
  <div id="avatarZone">
    <img id="petAvatar" src="img/hiyori.png" alt="伊蕾娜">
  </div>

  <!-- 底部：输入 -->
  <div id="inputZone">
    <input id="petInput" type="text" placeholder="和伊蕾娜说点什么…" autocomplete="off">
    <button id="petSend" type="button">➤</button>
  </div>
</div>
<script src="pet.js"></script>
</body>
</html>
